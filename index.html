<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Shape Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Header + level bar on top, shape tray beside (or below) a free-form build stage. */
:root {
    --bg: #FEF3C7;            /* page ground, warm amber */
    --stage: #FFFBEB;         /* build surface */
    --stage-dot: #F2B544;
    --panel: #FFF8E1;         /* tray + level bar */
    --panel-line: #FCD34D;
    --card: #FFFFFF;
    --ink: #451A03;           /* text */
    --ink-soft: #92400E;
    --brand: #D97706;         /* header */
    --brand-deep: #B45309;
    --accent: #F97316;        /* selection, active tab */
    --go: #059669;
    --stop: #DC2626;
    --sky: #0284C7;
    --on-dark: #FFFFFF;
    --shadow: rgba(69, 26, 3, .2);
    --font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 14px;
    -webkit-user-select: none; user-select: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* Tactile buttons */
.btn {
    font-family: var(--font-display); font-weight: 600; line-height: 1;
    border: 2px solid transparent; border-radius: 14px; padding: 8px 12px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    background: var(--card); color: var(--ink);
    box-shadow: 0 3px 0 var(--shadow);
    transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--shadow); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; box-shadow: 0 3px 0 var(--shadow); }
.btn.go { background: var(--go); color: var(--on-dark); }
.btn.stop { background: var(--stop); color: var(--on-dark); }
.btn.sky { background: var(--sky); color: var(--on-dark); }
.btn.plain { background: var(--card); border-color: var(--panel-line); }
.btn.ready { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }

/* Header */
.top {
    background: var(--brand); color: var(--on-dark); flex: none;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0; letter-spacing: .3px; }
.tabs, .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tab { background: var(--brand-deep); color: var(--on-dark); }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--on-dark); }

/* Level bar */
.bar {
    flex: none; background: var(--panel); border-bottom: 2px solid var(--panel-line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding-block: 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .group { display: flex; align-items: center; gap: 6px; }
.bar label, .bar .lbl { font-family: var(--font-display); font-weight: 600; color: var(--ink-soft); }
.seg { display: inline-flex; border: 2px solid var(--panel-line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--font-display); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-dark); }
.bar .btn { padding: 6px 10px; border-radius: 12px; }
#level-tip { color: var(--ink-soft); }
#name-input {
    width: 150px; max-width: 40vw; padding: 6px 10px; border-radius: 12px;
    border: 2px solid var(--panel-line); background: var(--card);
    -webkit-user-select: text; user-select: text;
}
#progress { margin-left: auto; font-family: var(--font-display); font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Workspace */
.work { flex: 1; min-height: 0; display: flex; }
.tray {
    flex: none; width: 250px; background: var(--panel); border-right: 3px solid var(--panel-line);
    display: flex; flex-direction: column; min-height: 0;
}
.tray h2 {
    margin: 0; padding: 8px 12px; font-family: var(--font-display); font-size: 16px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--panel-line);
}
.tray h2 small { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--ink-soft); }
#parts {
    flex: 1; min-height: 0; overflow-y: auto; padding: 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start;
    touch-action: pan-y;
}
.part {
    position: relative; background: var(--card); border: 2px solid var(--panel-line); border-radius: 14px;
    padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 3px 0 var(--shadow); min-width: 0;
}
.part:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.part svg { width: 56px; height: 56px; pointer-events: none; }
.part span.nm { font-family: var(--font-display); font-weight: 600; font-size: 12px; text-align: center; line-height: 1.15; }
.part .left {
    position: absolute; top: 4px; right: 4px; min-width: 24px; padding: 2px 5px; border-radius: 10px;
    background: var(--accent); color: var(--on-dark);
    font-family: var(--font-display); font-weight: 700; font-size: 12px; text-align: center; font-variant-numeric: tabular-nums;
}
.part.done { opacity: .6; }
.part.done .left { background: var(--go); }

.stage {
    flex: 1; min-width: 0; position: relative; overflow: hidden;
    background-color: var(--stage);
    background-image: radial-gradient(var(--stage-dot) 1px, transparent 1px);
    background-size: 24px 24px;
}
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#ghost { position: absolute; inset: 0; opacity: 0; transition: opacity .3s; pointer-events: none; }
#ghost.on { opacity: .22; }
#ghost svg { width: 100%; height: 100%; display: block; overflow: visible; }
#empty-tip {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: max-content; max-width: 80%;
    text-align: center; color: var(--ink-soft); font-family: var(--font-display); font-weight: 600; font-size: 16px;
    background: var(--card); border: 2px dashed var(--panel-line); border-radius: 14px; padding: 8px 14px; pointer-events: none;
}

.piece { position: absolute; cursor: grab; touch-action: none; border-radius: 6px; }
.piece::before { content: ""; position: absolute; inset: -5px; }   /* bigger touch target for tiny shapes */
.piece svg { position: relative; display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.piece:hover svg { filter: drop-shadow(0 2px 3px var(--shadow)); }
.piece.drag { cursor: grabbing; }
.piece.drag svg { filter: drop-shadow(0 6px 6px var(--shadow)); }
.piece.sel { outline: 2px dashed var(--accent); outline-offset: 3px; }
.piece:focus-visible { outline: 2px dashed var(--sky); outline-offset: 3px; }
.piece.wiggle svg { animation: wiggle .35s ease-in-out 4; }
.piece.count svg { animation: glow .8s ease-in-out infinite; }
@keyframes wiggle { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
@keyframes glow { 50% { filter: drop-shadow(0 0 5px var(--sky)) drop-shadow(0 0 2px var(--sky)); } }

/* Copy This card */
#target {
    position: absolute; top: 12px; right: calc(12px + env(safe-area-inset-right, 0px)); width: 200px; z-index: 5;
    background: var(--card); border: 3px solid var(--accent); border-radius: 16px; padding: 8px;
    box-shadow: 0 4px 10px var(--shadow); display: flex; flex-direction: column; gap: 6px;
}
#target.big { width: min(340px, 70%); }
#target header { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; color: var(--brand-deep); }
#target header div { display: flex; gap: 4px; }
#target header button { border: 0; border-radius: 8px; background: var(--bg); padding: 3px 7px; font-weight: 700; }
#target-pic { background: var(--stage); border: 1px solid var(--panel-line); border-radius: 10px; padding: 4px; }
#target-pic svg { display: block; width: 100%; height: auto; }
#target.min #target-pic, #target.min #look-bar { display: none; }
#target.min { width: auto; }
#target.gone #target-pic { display: none; }
#target.gone { width: auto; }
#memory-note { display: none; font-family: var(--font-display); font-weight: 600; color: var(--ink-soft); }
#target.gone #memory-note { display: block; }
#look-bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
#look-bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }

/* Selected-shape toolbar */
#tools {
    position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6;
    max-width: calc(100% - 16px);
    background: var(--card); border: 2px solid var(--accent); border-radius: 16px; padding: 6px 8px;
    box-shadow: 0 6px 16px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 5px;
}
#tool-name { font-family: var(--font-display); font-weight: 600; text-align: center; }
#tool-name b { color: var(--brand-deep); }
#tools .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
#tools .btn { padding: 7px 9px; border-radius: 11px; background: var(--bg); font-size: 13px; }
#tools .btn.stop { background: var(--stop); }

#toast {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: 86%;
    background: var(--ink); color: var(--on-dark); padding: 9px 18px; border-radius: 999px;
    font-family: var(--font-display); font-weight: 600; font-size: 15px; text-align: center; box-shadow: 0 4px 12px var(--shadow);
}
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

/* Dialog */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(69, 26, 3, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .box { background: var(--card); border: 3px solid var(--accent); border-radius: 20px; padding: 20px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 30px var(--shadow); }
#modal h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; text-wrap: balance; }
#modal p { margin: 0 0 14px; color: var(--ink-soft); font-size: 15px; }
#modal .choices { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
#modal .choices .btn { font-size: 18px; padding: 12px 18px; background: var(--bg); border-color: var(--panel-line); }
#modal .choices .btn.num { font-size: 24px; min-width: 62px; justify-content: center; }
#modal .choices .btn.go { background: var(--go); }
#modal .choices .btn.stop { background: var(--stop); }

@media (max-width: 760px) {
    .top h1 { font-size: 17px; }
    .work { flex-direction: column-reverse; }
    .tray { width: auto; border-right: 0; border-top: 3px solid var(--panel-line); }
    .tray h2 { padding: 4px 16px; font-size: 14px; }
    #parts {
        display: flex; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; padding-block: 8px 10px;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .part { flex: none; width: 88px; }
    .part svg { width: 44px; height: 44px; }
    #target { width: 118px; padding: 5px; }
    #level-tip, .btn .t { display: none; }
    #empty-tip { font-size: 14px; }
}
@media (max-width: 520px) { .top h1 { display: none; } .top { justify-content: center; } }
@media (prefers-reduced-motion: reduce) { .btn, #ghost { transition: none; } .btn.ready, .piece.wiggle svg, .piece.count svg { animation: none; } }
</style>
</head>
<body>
<header class="top">
    <h1>🔷 Thanksgiving Shape Challenge</h1>
    <nav class="tabs" aria-label="Pictures to build">
        <button class="btn tab" id="tab-turkey" data-mode="turkey">🦃 Turkey</button>
        <button class="btn tab" id="tab-pilgrim" data-mode="pilgrim">👒 Pilgrim</button>
        <button class="btn tab" id="tab-mayflower" data-mode="mayflower">⛵ Mayflower</button>
    </nav>
    <div class="actions">
        <button class="btn plain" id="btn-undo" title="Undo (Ctrl+Z)">↩️ <span class="t">Undo</span></button>
        <button class="btn stop" id="btn-reset" title="Start over">🔄 <span class="t">Reset</span></button>
        <button class="btn go" id="btn-done" title="Check my picture">✅ <span class="t">Done!</span></button>
        <button class="btn sky" id="btn-save" title="Save a picture">📸 <span class="t">Save</span></button>
        <button class="btn plain" id="btn-sound" title="Sound on or off" aria-pressed="true">🔊</button>
    </div>
</header>

<div class="bar">
    <div class="group">
        <span class="lbl" id="lvl-lbl">Level</span>
        <div class="seg" role="group" aria-labelledby="lvl-lbl">
            <button id="lvl-easy" data-level="easy">Easy</button>
            <button id="lvl-medium" data-level="medium">Medium</button>
            <button id="lvl-hard" data-level="hard">Hard</button>
        </div>
        <span id="level-tip"></span>
    </div>
    <button class="btn plain" id="btn-hint">👻 <span id="hint-text">Show outline</span></button>
    <button class="btn plain" id="btn-peek" hidden>👀 Peek</button>
    <div class="group">
        <label for="name-input">Name</label>
        <input id="name-input" type="text" maxlength="24" placeholder="Your name" autocomplete="off">
    </div>
    <div id="progress" aria-live="polite"></div>
</div>

<main class="work">
    <aside class="tray">
        <h2><span id="tray-title">Shapes</span> <small>Tap to add</small></h2>
        <div id="parts"></div>
    </aside>

    <section class="stage" id="stage" aria-label="Build area">
        <div id="world"><div id="ghost"></div></div>
        <div id="empty-tip">Tap a shape to add it. Then drag it into place!</div>

        <div id="target">
            <header>
                <span>🎯 Copy this!</span>
                <div>
                    <button id="btn-zoom" title="Make the picture bigger or smaller" aria-label="Zoom picture">🔍</button>
                    <button id="btn-min" title="Hide or show the picture" aria-label="Hide or show picture">▾</button>
                </div>
            </header>
            <div id="target-pic"></div>
            <div id="look-bar" hidden><i></i></div>
            <div id="memory-note">Hidden! Build it from memory.</div>
        </div>

        <div id="tools" hidden>
            <div id="tool-name"></div>
            <div class="row">
                <button class="btn" data-act="rotL" title="Turn left (Shift+R)">↺ <span class="t">Turn</span></button>
                <button class="btn" data-act="rotR" title="Turn right (R)">↻ <span class="t">Turn</span></button>
                <button class="btn" data-act="flip" title="Flip (F)">↔️ <span class="t">Flip</span></button>
                <button class="btn" data-act="bigger" title="Bigger (+)">➕</button>
                <button class="btn" data-act="smaller" title="Smaller (-)">➖</button>
                <button class="btn" data-act="front" title="Bring to front (])">⬆️ <span class="t">Front</span></button>
                <button class="btn" data-act="back" title="Send to back ([)">⬇️ <span class="t">Back</span></button>
                <button class="btn stop" data-act="del" title="Remove (Delete)">🗑️</button>
            </div>
        </div>

        <div id="toast" role="status" aria-live="polite" hidden></div>
        <canvas id="confetti"></canvas>
    </section>
</main>

<div id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3><p id="modal-text"></p><div class="choices" id="modal-choices"></div>
</div></div>

<script>
/**
 * THANKSGIVING SHAPE CHALLENGE
 * Single file, no libraries. Each picture is described once (parts + slots);
 * the "Copy this!" card, the outline, the tray, the answer check and the saved image all come from that data.
 * Positions are stored in picture units, so a build survives window resizes and reloads.
 */

// ---------- shape helpers (all drawn centred on 0,0) ----------
const circ = (r, f, s, sw = 3) => `<circle r="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const rect = (w, h, f, s, sw = 3, rx = 0) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const poly = (pts, f, s, sw = 3) => `<polygon points="${pts}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const path = (d, f, s, sw = 3) => `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const feather = (f, s) => poly('0,55 -32,-55 32,-55', f, s);
const fan = a => [160 + 55 * Math.sin(a * Math.PI / 180), 155 - 55 * Math.cos(a * Math.PI / 180), a];

const KIND = {
    circle:        { plural: 'circles',      fact: 'round, with 0 corners' },
    triangle:      { plural: 'triangles',    fact: '3 sides and 3 corners' },
    rectangle:     { plural: 'rectangles',   fact: '4 sides and 4 square corners' },
    square:        { plural: 'squares',      fact: '4 equal sides' },
    trapezoid:     { plural: 'trapezoids',   fact: '4 sides, 2 of them parallel' },
    'half circle': { plural: 'half circles', fact: '1 straight side and 1 curved side' },
    oval:          { plural: 'ovals',        fact: 'a stretched circle, 0 corners' }
};

// part: [id, name, kind, width, height, layer, svg]   slot: [partId, x, y, turn, flipped]
const MODES = {
    turkey: {
        label: 'Turkey', emoji: '🦃', W: 320, H: 300,
        parts: [
            ['body', 'Large Circle', 'circle', 116, 116, 6, circ(58, '#7C2D12', '#431407', 3.5)],
            ['head', 'Medium Circle', 'circle', 64, 64, 8, circ(32, '#9A3412', '#431407', 3.5)],
            ['wing', 'Half Circle', 'half circle', 30, 60, 7, path('M15,-30 A30 30 0 0 0 15,30 Z', '#9A3412', '#431407')],
            ['f-red', 'Red Triangle', 'triangle', 64, 110, 2, feather('#DC2626', '#7F1D1D')],
            ['f-orange', 'Orange Triangle', 'triangle', 64, 110, 2, feather('#F97316', '#9A3412')],
            ['f-yellow', 'Yellow Triangle', 'triangle', 64, 110, 2, feather('#EAB308', '#854D0E')],
            ['f-teal', 'Teal Triangle', 'triangle', 64, 110, 2, feather('#0D9488', '#115E59')],
            ['beak', 'Small Triangle', 'triangle', 24, 18, 11, poly('-12,-9 12,-9 0,9', '#FACC15', '#A16207', 2.5)],
            ['wattle', 'Red Oval', 'oval', 12, 24, 9, `<ellipse rx="6" ry="12" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>`],
            ['eye', 'Eye Circle', 'circle', 14, 14, 10, circ(7, '#FFFFFF', '#1E293B', 2) + `<circle r="3" fill="#0F172A"/>`],
            ['leg', 'Thin Rectangle', 'rectangle', 12, 44, 4, rect(12, 44, '#F59E0B', '#B45309', 2.5, 4)],
            ['foot', 'Wide Triangle', 'triangle', 36, 20, 5, poly('0,-10 -18,10 18,10', '#F59E0B', '#B45309', 2.5)]
        ],
        slots: [
            ['f-red', ...fan(-60)], ['f-orange', ...fan(-30)], ['f-yellow', ...fan(0)], ['f-orange', ...fan(30)], ['f-teal', ...fan(60)],
            ['leg', 140, 254], ['leg', 180, 254], ['foot', 140, 274], ['foot', 180, 274],
            ['body', 160, 185], ['wing', 87, 185], ['wing', 233, 185, 0, true],
            ['head', 160, 118], ['eye', 149, 110], ['eye', 171, 110], ['wattle', 169, 136], ['beak', 160, 131]
        ]
    },
    pilgrim: {
        label: 'Pilgrim', emoji: '👒', W: 300, H: 320,
        parts: [
            ['coat', 'Large Trapezoid', 'trapezoid', 128, 110, 5, poly('-42,-55 42,-55 64,55 -64,55', '#1E293B', '#0F172A', 3.5)],
            ['head', 'Peach Circle', 'circle', 68, 68, 6, circ(34, '#FDBA74', '#9A3412')],
            ['crown', 'Dark Rectangle', 'rectangle', 70, 52, 10, rect(70, 52, '#1E293B', '#0F172A', 3, 4)],
            ['brim', 'Long Rectangle', 'rectangle', 136, 14, 11, rect(136, 14, '#1E293B', '#0F172A', 3, 6)],
            ['band', 'White Rectangle', 'rectangle', 70, 12, 11, rect(70, 12, '#F8FAFC', '#94A3B8', 2)],
            ['buckle', 'Yellow Square', 'square', 20, 20, 12, rect(20, 20, '#FACC15', '#A16207', 2.5)],
            ['collar', 'White Triangle', 'triangle', 64, 34, 7, poly('-32,-17 32,-17 0,17', '#F8FAFC', '#94A3B8', 2.5)],
            ['belt', 'Brown Rectangle', 'rectangle', 106, 14, 7, rect(106, 14, '#78350F', '#451A03', 2)],
            ['arm', 'Sleeve Rectangle', 'rectangle', 44, 20, 3, rect(44, 20, '#334155', '#0F172A', 3, 6)],
            ['hand', 'Small Circle', 'circle', 20, 20, 4, circ(10, '#FDBA74', '#9A3412', 2.5)],
            ['legp', 'Short Rectangle', 'rectangle', 22, 28, 3, rect(22, 28, '#334155', '#0F172A')],
            ['shoe', 'Black Half Circle', 'half circle', 42, 21, 4, path('M-21,10.5 A21 21 0 0 1 21,10.5 Z', '#0F172A', '#0F172A', 1)],
            ['dot', 'Tiny Circle', 'circle', 8, 8, 9, circ(4, '#0F172A', '#0F172A', 0)],
            ['smile', 'Red Half Circle', 'half circle', 24, 12, 9, path('M-12,-6 A12 12 0 0 0 12,-6 Z', '#EF4444', '#991B1B', 1.5)]
        ],
        slots: [
            ['arm', 87, 172, -15], ['arm', 213, 172, 15], ['legp', 127, 278], ['legp', 173, 278],

            const a = document.createElement('a');
            a.download = filename; a.href = URL.createObjectURL(blob);
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        }
        SFX.fanfare(); toast('✅ Picture saved!');
    } catch (err) {
        if (err && err.code === 'declined') toast('Okay, not saved.');
        else toast('Saving is not available here. Ask your teacher for help.', 4000);
    }
}

// ---------- modes, levels, the Copy This card ----------
function buildTray() {
    const m = M(), box = $('parts');
    box.innerHTML = '';
    $('tray-title').textContent = `${m.emoji} ${m.label} shapes`;
    m.parts.forEach(part => {
        const v = Math.max(part.w, part.h, 44) + 8;
        const card = document.createElement('button');
        card.className = 'part'; card.id = 'part-' + part.id;
        card.innerHTML = `<svg viewBox="${-v / 2} ${-v / 2} ${v} ${v}">${part.svg}</svg><span class="nm">${part.name}</span><span class="left"></span>`;
        card.addEventListener('click', () => addPart(part));
        box.appendChild(card);
    });
}
function setMode(mode, quiet) {
    S.mode = mode; sel = null;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.mode === mode)));
    $('target-pic').innerHTML = targetSVG(mode);
    $('ghost').innerHTML = targetSVG(mode);
    buildTray(); layout(); renderPieces(); applyLevel(); persist();
    if (!quiet) SFX.pop();
}
function applyLevel() {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === S.level)));
    $('level-tip').textContent = LEVELS[S.level];
    $('btn-hint').hidden = S.level !== 'medium';
    $('btn-peek').hidden = S.level !== 'hard';
    $('hint-text').textContent = hintsOn ? 'Hide outline' : 'Show outline';
    $('ghost').classList.toggle('on', S.level === 'easy' || (S.level === 'medium' && hintsOn));
    clearTimeout(lookTimer); $('look-bar').hidden = true;
    $('target').classList.remove('gone');
    if (S.level === 'hard') look(10);
}
// Hard level: the picture shows for a few seconds, then hides.
function look(seconds) {
    const card = $('target'), bar = $('look-bar'), fill = bar.firstElementChild;
    clearTimeout(lookTimer);
    card.classList.remove('gone', 'min'); bar.hidden = false;
    if (fill.animate) fill.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: seconds * 1000, fill: 'forwards' });
    lookTimer = setTimeout(() => { card.classList.add('gone'); bar.hidden = true; }, seconds * 1000);
}

// ---------- wiring ----------
function init() {
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
        S.level = b.dataset.level; applyLevel(); persist(); SFX.pop();
        toast(b.textContent + ': ' + LEVELS[S.level]);
    }));
    $('btn-hint').addEventListener('click', () => { hintsOn = !hintsOn; applyLevel(); SFX.pop(); });
    $('btn-peek').addEventListener('click', () => { look(5); SFX.pop(); });
    $('btn-undo').addEventListener('click', undo);
    $('btn-done').addEventListener('click', done);
    $('btn-save').addEventListener('click', savePicture);
    $('btn-reset').addEventListener('click', () => {
        if (!board().length) { toast('The board is already empty.'); return; }
        openModal('Clear the whole board?', 'All your shapes will go back in the tray.', [
            { label: 'Yes, clear it', cls: 'stop', on: () => { remember(); S.boards[S.mode] = []; sel = null; changed(true); SFX.del(); toast('Board cleared. Tap Undo to bring it back.'); } },
            { label: 'Keep building', cls: 'go' }
        ]);
    });
    const snd = $('btn-sound'), paintSound = () => { snd.textContent = S.sound ? '🔊' : '🔇'; snd.setAttribute('aria-pressed', String(S.sound)); };
    snd.addEventListener('click', () => { S.sound = !S.sound; paintSound(); persist(); toast(S.sound ? 'Sound on' : 'Sound off'); SFX.pop(); });
    paintSound();
    $('btn-zoom').addEventListener('click', () => { $('target').classList.remove('min'); $('target').classList.toggle('big'); layout(); });
    $('btn-min').addEventListener('click', () => { $('target').classList.toggle('min'); layout(); });
    $('tools').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); });
    $('tools').addEventListener('pointerdown', e => e.stopPropagation());
    $('target').addEventListener('pointerdown', e => e.stopPropagation());
    $('stage').addEventListener('pointerdown', deselect);
    $('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) closeModal(); });
    const nm = $('name-input');
    nm.value = S.name;
    nm.addEventListener('input', () => { S.name = nm.value; persist(); });

    const firstGesture = () => { hadGesture = true; };
    window.addEventListener('pointerdown', firstGesture, true);
    window.addEventListener('keydown', firstGesture, true);
    window.addEventListener('keydown', e => {
        if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
        if (e.target.matches && e.target.matches('input, textarea')) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
        if (sel == null || e.ctrlKey || e.metaKey || e.altKey) return;
        const step = e.shiftKey ? 10 : 2;
        const keys = {
            ArrowLeft: () => nudge(-step, 0), ArrowRight: () => nudge(step, 0), ArrowUp: () => nudge(0, -step), ArrowDown: () => nudge(0, step),
            Delete: () => act('del'), Backspace: () => act('del'), Escape: deselect,
            r: () => act('rotR'), R: () => act('rotL'), f: () => act('flip'), F: () => act('flip'),
            '+': () => act('bigger'), '=': () => act('bigger'), '-': () => act('smaller'), ']': () => act('front'), '[': () => act('back')
        };
        if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
    });
    if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage')); else window.addEventListener('resize', layout);
    setMode(S.mode, true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
